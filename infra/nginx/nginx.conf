user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # X-Request-Id is generated here, at the edge, and echoed through every
    # response's meta.requestId (api-spec.md §7) — the correlation ID every
    # structured log line downstream carries (architecture.md §52).
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id; # nginx's built-in $request_id (a UUID) when the client sent none
    }

    log_format bts_main
        '$remote_addr - $req_id [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time';

    access_log  /var/log/nginx/access.log  bts_main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Request-size limit (architecture_nginx.md §15) — generous enough for
    # document attachments (architecture.md §7.14's export engine); the
    # module-specific limit (if any is ever smaller) is enforced by Express.
    client_max_body_size 20m;

    # Rate-limiting zones (architecture_nginx.md §14's policy, made
    # concrete — that document is intentionally qualitative only, so these
    # are Phase 0's own starting numbers, tune them once real traffic
    # patterns exist): strict on auth endpoints, moderate elsewhere.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
