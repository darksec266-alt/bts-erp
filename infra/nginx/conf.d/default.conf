# Path-based routing (architecture_nginx.md §7 — "simpler for smaller
# deployments," a deliberate, documented alternative to §6's preferred
# subdomain split). Works identically for local dev (http://localhost/) and
# this project's actual production deployment size; switch to §6's
# app.example.com / api.example.com split later by replacing this single
# file with two server blocks differentiated by server_name — no other
# change needed since the upstream definitions below don't change.

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # Timeout strategy (architecture_nginx.md §32): short/medium for normal
    # API calls; long report generation must go through BullMQ (Phase 15)
    # instead of a bigger timeout here, per that section's explicit rule.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Auth endpoints — strict rate limit (architecture_nginx.md §14).
    location ~ ^/api/v1/(auth|login|refresh) {
        limit_req zone=auth_zone burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://api_upstream;
    }

    # Realtime/WebSocket (architecture_nginx.md §13) — long-lived
    # connections need the Upgrade/Connection headers and a much longer
    # read timeout than a normal request.
    location /socket.io/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_pass http://api_upstream;
    }

    # Everything else under /api/ — moderate rate limit (architecture_nginx.md §14).
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://api_upstream;
    }

    # /health bypasses rate limiting entirely — Docker's own healthcheck
    # (architecture_nginx.md §24) must never be rate-limited into a false
    # "unhealthy" reading.
    location = /health {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://api_upstream/health;
    }

    # Everything not matched above goes to Next.js.
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://web_upstream;
    }
}
